safety_terms:
  critical:
    - term: fire
      hinglish: [aag, jalaa, fire, smok] # smok for smoke
    - term: explosion
      hinglish: [blast, explode, explode, explosive]
    - term: spark
      hinglish: [spark, current, shock]
    - term: electric_shock
      hinglish: [shock, current, electric]
    - term: burn
      hinglish: [burn, burn, jalaa, garm]
    - term: smoke
      hinglish: [smoke, dhuaa, fumes]

  high:
    - term: allergic
      hinglish: [allergy, allergic, rash, itch]
    - term: rash
      hinglish: [rash, khujli, skin]
    - term: choking
      hinglish: [choke, choking, dum_ghut]
    - term: bleeding
      hinglish: [bleed, bleeding, khun, cut]
    - term: injury
      hinglish: [injury, hurt, damage, chot, zakmi]
    - term: faint
      hinglish: [faint, behosh, chakkar]

  medium:
    - term: overheat
      hinglish: [overheat, garam, heating]
    - term: swell
      hinglish: [swell, bulge, phoola]
    - term: leak
      hinglish: [leak, leakage, risav]
    - term: toxic
      hinglish: [toxic, poison, chemical]

negation_window: 5
context_required: false # Removed context guard for higher recall
embedding_check_full_mode: true
